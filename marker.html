<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Marker-Based AR — AR MedCheck</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
  <script src="js/audio-cues.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    #overlay {
      position: fixed; top: 0; left: 0; right: 0; z-index: 999;
      padding: 14px 16px; background: rgba(15,26,22,0.85); color: #fff;
      font-family: -apple-system, sans-serif; font-size: 13px;
      display: flex; justify-content: space-between; align-items: center;
    }
    #overlay a { color: #9fe3c3; text-decoration: none; font-weight: 600; }
    #status {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      z-index: 999; background: rgba(15,26,22,0.85); color: #fff;
      padding: 8px 16px; border-radius: 999px; font-family: -apple-system, sans-serif;
      font-size: 12px;
      transition: background 0.3s ease;
    }
    #rxCard {
      position: fixed; top: 60px; right: 16px; z-index: 999;
      background: rgba(15,26,22,0.92); color: #fff; border-radius: 12px;
      padding: 14px 16px; font-family: -apple-system, sans-serif;
      max-width: 250px; border: 1px solid rgba(159,227,195,0.25);
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      backdrop-filter: blur(6px);
      display: none;
      animation: fadeIn 0.3s ease;
    }
    #rxCard.active { display: block; }
    #rxCard .rx-header {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
      color: #9fe3c3; font-weight: 700; margin-bottom: 4px;
    }
    #rxCard .rx-title { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
    #rxCard .rx-meta { font-size: 11px; color: #cfe8dc; line-height: 1.5; }
    #rxCard .rx-verified {
      display: inline-flex; align-items: center; gap: 4px;
      background: rgba(31,122,77,0.3); border: 1px solid #1f7a4d;
      color: #72e0a2; padding: 2px 8px; border-radius: 999px;
      font-size: 10px; font-weight: 600; margin-top: 8px;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div id="overlay">
    <span>Scan Rx Marker (<a href="target.html" target="_blank" style="text-decoration:underline;">View Target</a>)</span>
    <a href="index.html">&larr; Menu</a>
  </div>
  <div id="status">Marker not detected</div>

  <!-- Prescription Details HUD Card -->
  <div id="rxCard">
    <div class="rx-header">Rx Digital Verification</div>
    <div class="rx-title">Amoxicillin 500mg</div>
    <div class="rx-meta">
      <strong>Rx #:</strong> 8492-041<br/>
      <strong>Dosage:</strong> 1 capsule every 8h with water<br/>
      <strong>Refills:</strong> 2 remaining
    </div>
    <div class="rx-verified">✓ Authentic Label Recognized</div>
  </div>

  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix;"
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true;"
  >
    <a-assets>
      <a-asset-item id="bottle-model" src="assets/models/pill-bottle.glb"></a-asset-item>
    </a-assets>

    <a-marker preset="hiro" id="hiro-marker" emitevents="true">
      <a-entity
        gltf-model="#bottle-model"
        scale="0.4 0.4 0.4"
        position="0 0 0"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear"
      ></a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const marker = document.getElementById("hiro-marker");
    const statusEl = document.getElementById("status");
    const rxCard = document.getElementById("rxCard");

    marker.addEventListener("markerFound", () => {
      statusEl.textContent = "Prescription verified — label locked";
      statusEl.style.background = "rgba(31,122,77,0.9)";
      rxCard.classList.add("active");
      if (window.playSuccessChime) {
        window.playSuccessChime();
      }
    });

    marker.addEventListener("markerLost", () => {
      statusEl.textContent = "Marker not detected";
      statusEl.style.background = "rgba(15,26,22,0.85)";
      rxCard.classList.remove("active");
    });
  </script>
</body>
</html>
