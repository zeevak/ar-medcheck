<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Markerless AR — AR MedCheck</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body { margin: 0; overflow: hidden; background: #10261e; }
    #overlay {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      padding: 14px 16px; background: rgba(15,26,22,0.85); color: #fff;
      font-family: -apple-system, sans-serif; font-size: 13px;
      display: flex; justify-content: space-between; align-items: center;
    }
    #overlay a { color: #9fe3c3; text-decoration: none; font-weight: 600; }
    #legend {
      position: fixed; bottom: 90px; left: 16px; z-index: 10;
      background: rgba(15,26,22,0.88); color: #fff; border-radius: 10px;
      padding: 10px 14px; font-family: -apple-system, sans-serif; font-size: 11px;
      max-width: 270px; backdrop-filter: blur(4px);
    }
    #legend .sw-row { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
    #legend .sw { width: 9px; height: 9px; border-radius: 50%; }
    #liveStatus {
      margin-top: 8px; padding-top: 6px;
      border-top: 1px solid rgba(255,255,255,0.15);
      font-size: 11px;
    }
    .status-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px 8px;
      margin-top: 4px;
    }
    .status-item {
      display: flex !important;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      font-size: 10.5px;
    }
    #hint {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      z-index: 10; background: rgba(15,26,22,0.85); color: #fff;
      padding: 8px 16px; border-radius: 999px; font-family: -apple-system, sans-serif;
      font-size: 12px;
    }
    #unsupported {
      position: fixed; inset: 0; z-index: 20; background: #10261e; color: #fff;
      display: flex; align-items: center; justify-content: center; text-align: center;
      padding: 24px; font-family: -apple-system, sans-serif;
    }
    #unsupported.hidden { display: none; }
    /* Guards against the Start-AR button rendering underneath our overlay
       divs, which sit at the same bottom-of-screen position. */
    #ARButton { z-index: 1000 !important; }
  </style>
</head>
<body>
  <div id="overlay">
    <span>Tap a surface to place the shelf</span>
    <a href="index.html">&larr; Menu</a>
  </div>

  <div id="legend">
    <div class="sw-row"><span class="sw" style="background:#1f7a4d"></span> No active recall (safe)</div>
    <div class="sw-row"><span class="sw" style="background:#c23b3b"></span> Recall flagged (live FDA data)</div>
    <div id="liveStatus"></div>
  </div>

  <div id="hint">Loading recall data…</div>

  <div id="unsupported" class="hidden">
    <div>
      <h2>WebXR AR not supported on this device/browser</h2>
      <p>Markerless hit-test AR needs Chrome for Android with ARCore.<br/>
      Try opening this page on an Android phone in Chrome.</p>
      <a href="index.html" style="color:#9fe3c3">&larr; Back to menu</a>
    </div>
  </div>

  <script>
    // Runs immediately, independent of the module below — catches the case
    // where the module fails to even load (blocked import, offline CDN, etc).
    window.__arModuleStarted = false;
    setTimeout(() => {
      if (!window.__arModuleStarted) {
        const hintEl = document.getElementById("hint");
        hintEl.textContent = "AR module failed to load — check internet connection or try a different browser (see below for details)";
        hintEl.style.background = "rgba(194,59,59,0.9)";
      }
    }, 6000);
  </script>

  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/build/three.module.js"
    }
  }
  </script>

  <script src="js/fda-fetch.js"></script>
  <script src="js/audio-cues.js"></script>
  <script type="module">
    window.__arModuleStarted = true;

    import * as THREE from "three";
    import { ARButton } from "./vendor/three/jsm/webxr/ARButton.js";
    import { GLTFLoader } from "./vendor/three/jsm/loaders/GLTFLoader.js";

    const hintEl = document.getElementById("hint");
    const unsupportedEl = document.getElementById("unsupported");

    // Surface any runtime error directly on-screen instead of failing silently.
    window.addEventListener("error", (e) => {
      hintEl.textContent = "JS Error: " + e.message;
      hintEl.style.background = "rgba(194,59,59,0.9)";
    });
    window.addEventListener("unhandledrejection", (e) => {
      hintEl.textContent = "Promise error: " + (e.reason?.message || e.reason);
      hintEl.style.background = "rgba(194,59,59,0.9)";
    });

    // The "medicine cabinet" layout across shelf levels:
    // Tier 0 (Top Shelf): y ~ 0.148m
    // Tier 1 (Second Shelf): y ~ 0.1037m
    const CABINET_TIERS = [
      {
        name: "Top Shelf",
        yModel: 2.412,
        yFallback: 0.148,
        products: ["ibuprofen", "paracetamol", "amoxicillin"],
      },
      {
        name: "Second Shelf",
        yModel: 1.689,
        yFallback: 0.1037,
        products: ["lipitor", "acetaminophen", "melatonin"],
      },
    ];

    const TRACKED_PRODUCTS = CABINET_TIERS.flatMap((t) => t.products);
    let recallFlags = {}; // productName -> boolean, filled in by loadRecallData()

    // ---- Basic WebXR support check before doing anything else ----
    if (!navigator.xr) {
      unsupportedEl.classList.remove("hidden");
    } else {
      navigator.xr.isSessionSupported("immersive-ar").then((supported) => {
        if (!supported) unsupportedEl.classList.remove("hidden");
        else init();
      });
    }

    async function loadRecallData() {
      try {
        // Check each tracked product directly against openFDA, rather than
        // hoping its name happens to appear in a generic recent-records
        // batch — this is the actual "does THIS product have a live
        // recall" check the feature is meant to demonstrate.
        const results = await Promise.all(
          TRACKED_PRODUCTS.map((name) => fetchRecalls({ searchTerm: name, limit: 5 }))
        );
        TRACKED_PRODUCTS.forEach((name, i) => {
          recallFlags[name] = results[i].length > 0;
        });
        console.log("Recall flags (live, per-product):", recallFlags);
        hintEl.textContent = "Data loaded — tap a surface to place the shelf";
      } catch (err) {
        console.error("FDA fetch failed, defaulting to all-safe state:", err);
        // Fail-safe default: if the live API is unreachable, don't block the
        // AR demo — assume no known recalls rather than crashing the scene.
        TRACKED_PRODUCTS.forEach((p) => (recallFlags[p] = false));
        hintEl.textContent = "Live data unavailable — showing default state";
      }

      // Optional demo-reliability override: append ?forceRecall=ibuprofen
      // to the URL to force one product red regardless of live results —
      // useful for guaranteeing a visible "recall" state during a live
      // presentation without faking the underlying data pipeline.
      const params = new URLSearchParams(window.location.search);
      const forced = params.get("forceRecall");
      if (forced && TRACKED_PRODUCTS.includes(forced)) {
        recallFlags[forced] = true;
        console.log(`Demo override: forcing "${forced}" to recalled state`);
      }

      // Render the real, current state directly on-screen in a neat 2-column grid
      const liveStatusEl = document.getElementById("liveStatus");
      if (liveStatusEl) {
        liveStatusEl.innerHTML = `
          <div style="font-weight:600; color:#9fe3c3; margin-bottom:4px; font-size:10px; text-transform:uppercase; letter-spacing:0.06em;">Cabinet Recall Status:</div>
          <div class="status-grid">
            ${TRACKED_PRODUCTS.map(
              (p) => `
              <div class="status-item">
                <span>${p}:</span>
                <strong style="color:${recallFlags[p] ? '#ff7575' : '#5cd68d'}">
                  ${recallFlags[p] ? "RECALLED" : "safe"}
                </strong>
              </div>`
            ).join("")}
          </div>
        `;
      }
    }

    function init() {
      loadRecallData();

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        70, window.innerWidth / window.innerHeight, 0.01, 20
      );

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      document.body.appendChild(
        ARButton.createButton(renderer, { requiredFeatures: ["hit-test"] })
      );

      const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
      light.position.set(0.5, 1, 0.25);
      scene.add(light);

      // ---- Reticle: shows where content will be placed ----
      const reticle = new THREE.Mesh(
        new THREE.RingGeometry(0.06, 0.08, 32).rotateX(-Math.PI / 2),
        new THREE.MeshBasicMaterial({ color: 0x0f6b5c })
      );
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      const loader = new GLTFLoader();

      function buildShelfGroup() {
        const group = new THREE.Group();
        const tierGroups = [];

        console.log("Building shelf with recallFlags:", JSON.parse(JSON.stringify(recallFlags)));

        CABINET_TIERS.forEach((tier) => {
          const tierGroup = new THREE.Group();
          tierGroup.position.y = tier.yFallback;
          group.add(tierGroup);
          tierGroups.push(tierGroup);

          tier.products.forEach((name, i) => {
            const isRecalled = !!recallFlags[name];
            const bottleGroup = new THREE.Group();

            // Realistic pill bottle body (height 2.4cm)
            const body = new THREE.Mesh(
              new THREE.CylinderGeometry(0.010, 0.010, 0.024, 16),
              new THREE.MeshStandardMaterial({
                color: isRecalled ? 0xc23b3b : 0x1f7a4d,
                roughness: 0.3,
                metalness: 0.1,
              })
            );
            body.position.y = 0.012; // base sits at y = 0
            bottleGroup.add(body);

            // Childproof pharmaceutical cap on top (height 0.6cm)
            const cap = new THREE.Mesh(
              new THREE.CylinderGeometry(0.008, 0.008, 0.006, 16),
              new THREE.MeshStandardMaterial({
                color: 0xf4f7f5,
                roughness: 0.5,
              })
            );
            cap.position.y = 0.024 + 0.003;
            bottleGroup.add(cap);

            // Spread bottles along X (left-to-right along the shelf length)
            const spread = (i - (tier.products.length - 1) / 2) * 0.038;
            bottleGroup.position.set(spread, 0, 0);
            bottleGroup.userData.product = name;
            bottleGroup.userData.recalled = isRecalled;
            tierGroup.add(bottleGroup);
          });
        });

        // Shelf base — loads the model, rotates 90 deg so the front faces the user
        // and shelves run along X, perfectly matching the bottle rows.
        loader.load(
          "assets/models/shelf.glb",
          (gltf) => {
            const model = gltf.scene;
            // Rotate 90 deg around Y so the wide front faces the user (shelves run along X)
            model.rotation.y = Math.PI / 2;

            const box = new THREE.Box3().setFromObject(model);
            const size = new THREE.Vector3();
            box.getSize(size);
            const maxDim = Math.max(size.x, size.y, size.z) || 1;
            const scale = 0.15 / maxDim; // fixed, realistic footprint
            model.scale.setScalar(scale);

            // Re-measure after scaling and align feet to y = 0
            box.setFromObject(model);
            model.position.y = -box.min.y;
            box.setFromObject(model);

            // Dynamically lock each tier directly to its model shelf board surface:
            // Top shelf board: yModel = 2.412; Second shelf board: yModel = 1.689
            CABINET_TIERS.forEach((tier, idx) => {
              tierGroups[idx].position.y = tier.yModel * scale;
            });
            group.add(model);
          },
          undefined,
          () => {
            const base = new THREE.Mesh(
              new THREE.BoxGeometry(0.14, 0.02, 0.06),
              new THREE.MeshStandardMaterial({ color: 0xd7cba6 })
            );
            base.position.y = 0.01;
            group.add(base);
            tierGroups[0].position.y = 0.02;
            if (tierGroups[1]) tierGroups[1].visible = false;
          }
        );

        return group;
      }

      let hitTestSource = null;
      let hitTestSourceRequested = false;

      controllerSetup();
      function controllerSetup() {
        const controller = renderer.xr.getController(0);
        controller.addEventListener("select", () => {
          if (!reticle.visible) return;
          const shelf = buildShelfGroup();
          shelf.position.setFromMatrixPosition(reticle.matrix);
          shelf.quaternion.setFromRotationMatrix(reticle.matrix);
          scene.add(shelf);

          const hasRecall = TRACKED_PRODUCTS.some((p) => recallFlags[p]);
          if (hasRecall) {
            window.playAlertChime && window.playAlertChime();
            hintEl.textContent = "Recall detected on this shelf";
            hintEl.style.background = "rgba(194,59,59,0.9)";
          } else {
            window.playSuccessChime && window.playSuccessChime();
            hintEl.textContent = "Shelf placed — no active recalls";
            hintEl.style.background = "rgba(31,122,77,0.9)";
          }
        });
        scene.add(controller);
      }

      renderer.setAnimationLoop((timestamp, frame) => {
        if (frame) {
          const referenceSpace = renderer.xr.getReferenceSpace();
          const session = renderer.xr.getSession();

          if (!hitTestSourceRequested) {
            session.requestReferenceSpace("viewer").then((refSpace) => {
              session.requestHitTestSource({ space: refSpace }).then((source) => {
                hitTestSource = source;
              });
            });
            session.addEventListener("end", () => {
              hitTestSourceRequested = false;
              hitTestSource = null;
            });
            hitTestSourceRequested = true;
          }

          if (hitTestSource) {
            const hitTestResults = frame.getHitTestResults(hitTestSource);
            if (hitTestResults.length) {
              const hit = hitTestResults[0];
              reticle.visible = true;
              reticle.matrix.fromArray(
                hit.getPose(referenceSpace).transform.matrix
              );
            } else {
              reticle.visible = false;
            }
          }
        }
        renderer.render(scene, camera);
      });

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }
  </script>
</body>
</html>
